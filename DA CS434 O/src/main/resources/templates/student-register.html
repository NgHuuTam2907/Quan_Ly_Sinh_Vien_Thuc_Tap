<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký thực tập</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h2>UC-01: Đăng ký thực tập Sinh viên</h2>
    
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

    <form action="/student/register" method="get" class="mb-4 row g-2">
        <div class="col-auto">
            <input type="text" name="keyword" class="form-control" placeholder="Tìm kiếm doanh nghiệp..." th:value="${keyword}">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-secondary">Tìm kiếm</button>
        </div>
    </form>

    <form action="/student/register" method="post" th:object="${registration}">
        <div class="mb-3">
            <label class="form-label">Mã sinh viên:</label>
            <input type="text" th:field="*{studentId}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Họ và tên:</label>
            <input type="text" th:field="*{fullName}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Lớp sinh hoạt:</label>
            <input type="text" th:field="*{studentClass}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Chọn doanh nghiệp:</label>
            <select th:field="*{companyId}" class="form-select" required>
                <option value="">-- Chọn doanh nghiệp --</option>
                <option th:each="comp : ${companies}" th:value="${comp.id}" th:text="${comp.name} + ' (' + ${comp.industry} + ')'"></option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Vị trí thực tập:</label>
            <input type="text" th:field="*{positionTitle}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Đường dẫn CV (URL):</label>
            <input type="text" th:field="*{cvUrl}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Nguyện vọng bổ sung:</label>
            <textarea th:field="*{aspiration}" class="form-control"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Gửi đăng ký</button>
    </form>
</body>
</html>
