<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Doanh nghiệp</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h2>UC-02: Quản lý thông tin Doanh nghiệp</h2>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

    <form action="/admin/companies" method="get" class="mb-4 row g-2">
        <div class="col-auto">
            <input type="text" name="keyword" class="form-control" placeholder="Tìm tên/ngành nghề..." th:value="${keyword}">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-secondary">Tìm kiếm</button>
        </div>
    </form>

    <div class="card mb-4">
        <div class="card-header">Thêm doanh nghiệp mới</div>
        <div class="card-body">
            <form action="/admin/companies/add" method="post" th:object="${newCompany}">
                <div class="row g-3">
                    <div class="col-md-3">
                        <input type="text" th:field="*{name}" class="form-control" placeholder="Tên công ty" required>
                    </div>
                    <div class="col-md-3">
                        <input type="text" th:field="*{industry}" class="form-control" placeholder="Lĩnh vực" required>
                    </div>
                    <div class="col-md-3">
                        <input type="text" th:field="*{address}" class="form-control" placeholder="Địa chỉ" required>
                    </div>
                    <div class="col-md-2">
                        <input type="number" th:field="*{positions}" class="form-control" placeholder="Chỉ tiêu" required>
                    </div>
                    <div class="col-md-1">
                        <button type="submit" class="btn btn-success">Thêm</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <h4>Danh sách doanh nghiệp</h4>
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>ID</th>
                <th>Tên công ty</th>
                <th>Lĩnh vực</th>
                <th>Địa chỉ</th>
                <th>Chỉ tiêu</th>
                <th>Hành động</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="comp : ${companies}">
                <td th:text="${comp.id}"></td>
                <td th:text="${comp.name}"></td>
                <td th:text="${comp.industry}"></td>
                <td th:text="${comp.address}"></td>
                <td th:text="${comp.positions}"></td>
                <td>
                    <a th:href="@{/admin/companies/delete/{id}(id=${comp.id})}" class="btn btn-danger btn-sm" onclick="return confirm('Bạn có chắc muốn xóa?')">Xóa</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
